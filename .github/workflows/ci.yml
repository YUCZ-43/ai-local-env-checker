name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli-go/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json

      - name: Check preinstalled Rust toolchain
        shell: pwsh
        run: |
          cargo --version
          rustc --version

      - name: PowerShell parser checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @(
            "install.ps1",
            "verify.ps1",
            "scripts/windows",
            "scripts/dev"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) { continue }
            $item = Get-Item -LiteralPath $path
            $files = if ($item.PSIsContainer) {
              Get-ChildItem -LiteralPath $path -File -Filter "*.ps1" -Recurse
            } else {
              @($item)
            }
            foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                foreach ($errorItem in $errors) {
                  Write-Error "$($file.FullName): $($errorItem.Message)"
                }
                throw "PowerShell parser check failed"
              }
              Write-Host "OK $($file.FullName)"
            }
          }

      - name: JSON parse checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dirs = @(
            "core/schema",
            "core/tool-catalog",
            "examples/tool-catalog",
            "examples/install-plans",
            "examples/reports"
          )
          foreach ($dir in $dirs) {
            if (-not (Test-Path -LiteralPath $dir)) {
              throw "Missing JSON directory: $dir"
            }
            Get-ChildItem -LiteralPath $dir -File -Filter "*.json" | ForEach-Object {
              Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json | Out-Null
              Write-Host "OK $($_.FullName)"
            }
          }

      - name: Go test and build
        shell: pwsh
        working-directory: apps/cli-go
        run: |
          $ErrorActionPreference = "Stop"
          go test ./...
          go build ./...

      - name: Desktop npm test and build
        shell: pwsh
        working-directory: apps/desktop-tauri
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath "package.json") {
            npm ci --ignore-scripts
            npm test
            npm run build
          }

      - name: Tauri backend cargo test
        shell: pwsh
        working-directory: apps/desktop-tauri/src-tauri
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath "Cargo.toml") {
            cargo test
          }

      - name: Bash syntax checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if (-not $bash) {
            Write-Host "bash not found; skipping Bash syntax checks on this runner"
            exit 0
          }
          $files = @(
            "scripts/wsl/check-wsl.sh",
            "scripts/linux/check-linux.sh",
            "scripts/macos/check-macos.sh",
            "scripts/release/build-release.sh"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing Bash script: $file"
            }
            Get-Content -LiteralPath $file -Raw | bash -n
            if ($LASTEXITCODE -ne 0) {
              throw "bash -n failed: $file"
            }
            Write-Host "OK $file"
          }

      - name: Run latest safe validation script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath "scripts/dev/check-v0.6.1-tool-catalog.ps1") {
            powershell -ExecutionPolicy Bypass -File .\scripts\dev\check-v0.6.1-tool-catalog.ps1
          } elseif (Test-Path -LiteralPath "scripts/dev/check-v0.6.0-gui.ps1") {
            powershell -ExecutionPolicy Bypass -File .\scripts\dev\check-v0.6.0-gui.ps1
          } elseif (Test-Path -LiteralPath "scripts/dev/check-v0.5.0-runner.ps1") {
            powershell -ExecutionPolicy Bypass -File .\scripts\dev\check-v0.5.0-runner.ps1
          } else {
            throw "No known safe validation script found"
          }

      - name: Artifact guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tracked = git ls-files
          $blocked = $tracked | Where-Object {
            if ($_ -match '(^|/)(logs|reports|dist)/\.gitkeep$') {
              return $false
            }
            $_ -match '(^|/)(logs|reports|dist|node_modules|target)(/|$)' -or
            $_ -match '\.(exe|msi|zip|tar\.gz|tgz|7z)$' -or
            $_ -match '(^|/)\.env($|\.)' -or
            $_ -match '(token|tokens|key|keys|pem|pfx|p12)$'
          }
          if ($blocked) {
            $blocked | ForEach-Object { Write-Error "Generated or secret-like file is tracked: $_" }
            throw "Artifact guard failed"
          }
          Write-Host "Tracked artifact guard passed"

      - name: Forbidden source scan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $localUserPathPattern = "C:" + "\Users\" + "huang"
          $fixedProxyPortPattern = "108" + "70"
          $patterns = @($localUserPathPattern, $fixedProxyPortPattern)
          $roots = @(".github", "README.md", "README.en-US.md", "README.zh-CN.md", "apps", "core", "docs", "examples", "scripts")
          foreach ($pattern in $patterns) {
            foreach ($root in $roots) {
              if (-not (Test-Path -LiteralPath $root)) { continue }
              $item = Get-Item -LiteralPath $root
              $files = if ($item.PSIsContainer) {
                Get-ChildItem -LiteralPath $root -File -Recurse |
                  Where-Object {
                    $_.FullName -notmatch "\\node_modules\\" -and
                    $_.FullName -notmatch "\\dist\\" -and
                    $_.FullName -notmatch "\\target\\" -and
                    $_.FullName -notmatch "\\gen\\" -and
                    $_.FullName -notmatch "\\logs\\" -and
                    $_.FullName -notmatch "\\reports\\"
                  }
              } else {
                @($item)
              }
              $matches = $files | Select-String -Pattern $pattern -SimpleMatch -ErrorAction SilentlyContinue
              if ($matches) {
                $matches | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): forbidden value found" }
                throw "Forbidden source scan failed"
              }
            }
          }
          Write-Host "Forbidden source scan passed"
